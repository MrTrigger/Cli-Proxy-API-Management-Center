name: Triggerlab proxy image

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'Dockerfile'
      - 'backend-patches/**'
      - '.dockerignore'
      - '.github/workflows/triggerlab-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mrtrigger/cli-proxy-api:sha-${{ github.sha }}
          build-args: VERSION=1.25.2-triggerlab-${{ github.sha }}
